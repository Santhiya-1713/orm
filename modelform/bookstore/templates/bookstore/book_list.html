<html>
    <head>
        <title>
            Book List
        </title>
    </head>
    <body>
        <h1>Book list</h1>
        <ul>
            {%for book in books%}
            <li><a href="{% url 'book_detail' pk=book.pk%}">{{book.title}} by {{book.author}}</a></li>
            {%endfor%}
        </ul>
    </body>
</html>
