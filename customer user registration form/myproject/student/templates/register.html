{% extends "base.html" %}

{% block content %}

<h2>Student Registration</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <input type="submit" value="Register">
</form>

<p>
    Already have an account?
    <a href="{% url 'login' %}">Login</a>
</p>

{% endblock %}
